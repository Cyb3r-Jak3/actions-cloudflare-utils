name: 'cloudflare-utils'
description: 'Install cloudflare-utils'
author: 'Cyb3r-Jak3'
inputs:
  version:
    required: false
    description: 'Version of cloudflare-utils to install'
    default: 'latest'
  github_token:
    required: false
    description: 'GitHub token used to use the GitHub API to get the release. By default, it uses the GITHUB_TOKEN secret.'
    default: ${{ github.token }}
  args:
    required: false
    description: 'Args to run with cloudflare-utils. If not provided, the action will only install cloudflare-utils.'
    default: ''
  skip_token_check:
    required: false
    description: 'Skip permission check for the Cloudflare API token. If set to true, the action will not check if the token has the necessary permissions to access the Cloudflare API.'
    default: 'true'
runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'download-cloud'
  color: 'orange'
