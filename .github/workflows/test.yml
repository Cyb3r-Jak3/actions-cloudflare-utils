name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - run: |
          pnpm install
      - run: |
          pnpm run all
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install latest version with token
        uses: ./
        with:
          version: 'latest'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          args: '--version'

      - name: Install specific version with token
        uses: ./
        with:
          version: '1.8.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          args: '--version'
          skip_token_check: 'false'

      - name: Install latest version without setting token
        uses: ./
        with:
          version: 'latest'

      - name: Install specific version without setting token
        uses: ./
        with:
          version: '1.9.0'
          args: '--version'

      - name: Install without setting args
        uses: ./
        with:
          version: 'latest'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install of semver range
        uses: ./
        with:
          version: '>=1.9.0,<2'
          github_token: ${{ secrets.GITHUB_TOKEN }}